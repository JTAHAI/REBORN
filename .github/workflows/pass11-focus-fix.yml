name: REBORN Pass 11 pause focus correction
on:
  push:
    branches: [chatgpt/reborn-pass11-crash-recovery]
    paths: [.github/workflows/pass11-focus-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Keep owner focus on established settings; protected tabs still focus export
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old="document.querySelector('#pause .ux-settings-body').prepend(panel);"
          new="document.querySelector('#pause .ux-settings-body').append(panel);"
          for name in ['src/crash-recovery-ui.js','index.html']:
           p=Path(name);s=p.read_text();assert s.count(old)==1,(name,s.count(old));p.write_text(s.replace(old,new))
          PY
          node tools/bundle.cjs
          node tests/crash-recovery.cjs
          node tests/session-saves.cjs
          node tests/smoke.cjs
          git diff --check
          test "$(git diff --name-only)" = $'dist/index.html\nindex.html\nsrc/crash-recovery-ui.js'
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add src/crash-recovery-ui.js index.html dist/index.html
          git commit -m 'Keep normal pause focus ahead of manual recovery controls'
          git push origin HEAD:refs/heads/chatgpt/reborn-pass11-crash-recovery
