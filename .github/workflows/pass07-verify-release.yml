name: Verify and package REBORN Pass 7
on:
  push:
    branches: ['chatgpt/pass07-verify-release']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      REBORN_BROWSER_DRIVER: playwright
      REBORN_BROWSER_LOW: '1'
      REBORN_SCREENSHOTS: /tmp/pass07-evidence/screenshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fdd6b07436ced68ea9a2e70b0891abb1752e4270
          fetch-depth: 0
      - name: Apply checksum-verified Pass 7 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/chatgpt/reborn-pass06-echo-roads | cut -f1)" = 'fdd6b07436ced68ea9a2e70b0891abb1752e4270'
          test -z "$(git ls-remote origin refs/heads/chatgpt/reborn-pass07-memory-replay)"
          curl -fL --retry 4 --retry-delay 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-3f84-81f5-98f2-fdb577e6c651/raw?se=2026-09-27T07%3A35%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=5cb64149-b0f9-5daf-9457-cc1c9a214b64&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T21%3A05%3A40Z&ske=2026-09-27T21%3A05%3A40Z&sks=b&skv=2026-02-06&sig=1f9UooYunppYaQzA8aO1j3mqhzypNeY8Vbu3qqCppds%3D' -o /tmp/pass07.zip
          echo 'f8c28be409e3321e7d0a1e813f1ccfdf2d0365aad571419059a71fcd2e9bf189  /tmp/pass07.zip' | sha256sum -c -
          unzip -t /tmp/pass07.zip
          git switch -c chatgpt/reborn-pass07-memory-replay
          unzip -o /tmp/pass07.zip
          mkdir -p /tmp/pass07-evidence/screenshots
          npm run build
          npm run build:site
      - name: Install test-only browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("REBORN_CHROMIUM="+p.chromium.executable_path)' >> "$GITHUB_ENV"
      - name: Core, driving, asset and package regressions
        shell: bash
        run: |
          set -euo pipefail
          {
            npm test
            npm run validate:assets
            npm run test:http
            node tests/controls-acceptance.cjs
            node tests/driving-behavior.cjs
            node tests/readability-acceptance.cjs
            node tests/vehicle-shell-acceptance.cjs
            node tests/town-packaging.cjs
            npm run test:site
            node --check standalone-dist/sw.js
            git diff --exit-code -- assets/worlds/north-berwick/world.json assets/vehicles/jetta-mkiv/volkswagen-bora-jetta-mk4-2005.cc-by-4.0.glb legacy/99-5-REBORN-Build-004-PLAY.html
            git diff --check
          } 2>&1 | tee /tmp/pass07-evidence/regressions.log
      - name: Memory recording, ghost, replay and diagnostic audio browser acceptance
        shell: bash
        run: |
          set -o pipefail
          npm run test:memory:browser 2>&1 | tee /tmp/pass07-evidence/memory-browser.log
      - name: Existing desktop and touch UX
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run test:ux 2>&1 | tee /tmp/pass07-evidence/ux.log
      - name: Weather, passenger and Echo Roads browser regressions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            npm run test:weather:browser
            npm run test:stories:browser
            npm run test:stories:packaged
            npm run test:echo:browser
          } 2>&1 | tee /tmp/pass07-evidence/prior-browser.log
      - name: Full website, offline and historical cache upgrade
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run test:site:browser 2>&1 | tee /tmp/pass07-evidence/website.log
      - name: Commit and push only the verified integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add README.md index.html dist docs package.json package-lock.json src tests tools website website-game-shell
          git diff --cached --check
          git commit -m 'Add local drive memories, route ghosts and diagnostic replay'
          git push origin HEAD:refs/heads/chatgpt/reborn-pass07-memory-replay
          git rev-parse HEAD | tee /tmp/pass07-evidence/source-commit.txt
          npm run package:site 2>&1 | tee /tmp/pass07-evidence/packages.log
          npm run test:site
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reborn-pass07-evidence
          path: /tmp/pass07-evidence/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reborn-pass07-deployment-packages
          path: packages/
          retention-days: 7
          if-no-files-found: error
