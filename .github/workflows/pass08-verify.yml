name: REBORN Pass 8 integration gates
on:
  push:
    branches: ['chatgpt/pass08-build']
    paths: ['.github/workflows/pass08-verify.yml']
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 70415de1fd00c5df45f9d2b985b1386023517346
          fetch-depth: 0
      - name: Preserve final contextual HUD repair without changing main or production
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/chatgpt/reborn-pass08-release-hardening | cut -f1)" = '70415de1fd00c5df45f9d2b985b1386023517346'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/release-ux.js');s=p.read_text()
          s=s.replace("$('radio').hidden=$('radio').hidden||contextBusy;", "document.body.dataset.roadside=String(!!$('town-interact')&&!$('town-interact').hidden);\n $('radio').hidden=$('radio').hidden||contextBusy;")
          s=s.replace("$('release-audio-caption').hidden=!settings.diagnosticCaptions||!captions||choice||!!list.length;", "$('release-audio-caption').hidden=!settings.diagnosticCaptions||!captions||contextBusy||!!list.length||!!echoDirector?.state.active||!!memoryGhost;")
          p.write_text(s)
          p=Path('src/release-ux.css');p.write_text(p.read_text()+'''/* A real roadside prompt owns the lowest contextual lane. */
          body.touch #hud #echo-strip[data-incident=true],body.touch[data-roadside=true] #hud #memory-ghost-strip{bottom:78px}
          #hud #memory-ghost-strip{top:auto}
          ''')
          p=Path('tests/memory-replay-browser.py');s=p.read_text()
          s=s.replace("assert page.locator('#memory-ghost-strip').is_visible()", "assert page.locator('#memory-ghost-strip').is_visible()\n  assert page.locator('#memory-ghost-strip').bounding_box()['height']<=100")
          s=s.replace("assert ghost and all(r['height']>=44 for r in buttons)","assert ghost and ghost['height']<=100 and all(r['height']>=44 for r in buttons)")
          p.write_text(s)
          PY
          npm run build
          node tests/town-packaging.cjs
          node tests/release-hardening.cjs
          git diff --exit-code -- assets legacy
          git diff --check
          git switch -c chatgpt/reborn-pass08-release-hardening
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add index.html dist src/release-ux.css src/release-ux.js tests/memory-replay-browser.py
          git commit -m 'Keep memory and roadside controls in compact noncompeting HUD lanes'
          git push origin HEAD:refs/heads/chatgpt/reborn-pass08-release-hardening
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        gate: [core, release, updates, ux, memory, workshop, weather, passengers, echoes, website]
    env:
      REBORN_BROWSER_DRIVER: playwright
      REBORN_BROWSER_LOW: '1'
      REBORN_SCREENSHOTS: /tmp/pass08-evidence/screenshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.checkpoint.outputs.source }}
      - run: mkdir -p /tmp/pass08-evidence && npm run build:site
      - if: matrix.gate != 'core'
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("REBORN_CHROMIUM="+p.chromium.executable_path)' >> "$GITHUB_ENV"
      - name: Run independent acceptance
        shell: bash
        run: |
          set -euo pipefail
          {
            case '${{ matrix.gate }}' in
              core) npm test; npm run validate:assets; npm run test:http; node tests/controls-acceptance.cjs; node tests/driving-behavior.cjs; node tests/readability-acceptance.cjs; node tests/vehicle-shell-acceptance.cjs; node tests/town-packaging.cjs; npm run test:site; git diff --exit-code;;
              release) npm run test:release:browser;;
              updates) npm run test:updates:browser;;
              ux) npm run test:ux;;
              memory) npm run test:memory:browser;;
              workshop) npm run test:workshop:browser;;
              weather) npm run test:weather:browser;;
              passengers) npm run test:stories:browser; npm run test:stories:packaged;;
              echoes) npm run test:echo:browser;;
              website) npm run test:site:browser;;
            esac
          } 2>&1 | tee /tmp/pass08-evidence/results.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reborn-pass08-${{ matrix.gate }}-evidence
          path: /tmp/pass08-evidence/
          retention-days: 7
  packages:
    needs: [checkpoint, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.checkpoint.outputs.source }}
      - run: npm run package:site && npm run test:site && git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reborn-pass08-deployment-packages
          path: packages/
          retention-days: 7
          if-no-files-found: error
