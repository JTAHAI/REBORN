name: REBORN Pass 8 integration gates
on:
  push:
    branches: ['chatgpt/pass08-build']
    paths: ['.github/workflows/pass08-verify.yml']
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0ae574c501631593fd31208096786764b0b71184
          fetch-depth: 0
      - name: Preserve draft source without changing main or production
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/chatgpt/reborn-pass08-release-hardening | cut -f1)" = '0ae574c501631593fd31208096786764b0b71184'
          curl -fL --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-2c40-81f5-ba97-97cc8dd05030/raw?se=2026-09-28T04%3A11%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=60642f6a-b518-5dc3-b879-18c602364f2f&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A18%3A06Z&ske=2026-09-29T00%3A18%3A06Z&sks=b&skv=2026-02-06&sig=pcgfbTwC/8HcLwUfWqvHkRqGTKqTo4dqDMP0yYECVCU%3D' -o /tmp/pass08.zip
          echo '337c2bdcc34814ccb98a1d349f9c7ebdd0d1ac505af6c4c3edfbb2110c9a4ed7  /tmp/pass08.zip' | sha256sum -c -
          unzip -o /tmp/pass08.zip
          npm run build
          node tests/town-packaging.cjs
          node tests/release-hardening.cjs
          git diff --exit-code -- assets legacy
          git diff --check
          git switch -c chatgpt/reborn-pass08-release-hardening
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add README.md docs index.html dist package.json package-lock.json src tests tools website website-game-shell
          git commit -m 'Refine hometown HUD and complete save, update and rendering safety'
          git push origin HEAD:refs/heads/chatgpt/reborn-pass08-release-hardening
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        gate: [core, release, updates, ux, memory, workshop, weather, passengers, echoes, website]
    env:
      REBORN_BROWSER_DRIVER: playwright
      REBORN_BROWSER_LOW: '1'
      REBORN_SCREENSHOTS: /tmp/pass08-evidence/screenshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.checkpoint.outputs.source }}
      - run: mkdir -p /tmp/pass08-evidence && npm run build:site
      - if: matrix.gate != 'core'
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("REBORN_CHROMIUM="+p.chromium.executable_path)' >> "$GITHUB_ENV"
      - name: Run independent acceptance
        shell: bash
        run: |
          set -euo pipefail
          {
            case '${{ matrix.gate }}' in
              core) npm test; npm run validate:assets; npm run test:http; node tests/controls-acceptance.cjs; node tests/driving-behavior.cjs; node tests/readability-acceptance.cjs; node tests/vehicle-shell-acceptance.cjs; node tests/town-packaging.cjs; npm run test:site; git diff --exit-code;;
              release) npm run test:release:browser;;
              updates) npm run test:updates:browser;;
              ux) npm run test:ux;;
              memory) npm run test:memory:browser;;
              workshop) npm run test:workshop:browser;;
              weather) npm run test:weather:browser;;
              passengers) npm run test:stories:browser; npm run test:stories:packaged;;
              echoes) npm run test:echo:browser;;
              website) npm run test:site:browser;;
            esac
          } 2>&1 | tee /tmp/pass08-evidence/results.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reborn-pass08-${{ matrix.gate }}-evidence
          path: /tmp/pass08-evidence/
          retention-days: 7
  packages:
    needs: [checkpoint, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.checkpoint.outputs.source }}
      - run: npm run package:site && npm run test:site && git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reborn-pass08-deployment-packages
          path: packages/
          retention-days: 7
          if-no-files-found: error
