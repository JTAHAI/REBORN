name: REBORN Pro final engine
on:
  push:
    branches: [chatgpt/reborn-pro-driving-pass23]
    paths: [.github/workflows/pro-final.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply modal correction and retain the original P pause key
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          cp .github/pro-modal-fix.py /tmp/pro-modal-fix.py
          cp tests/hometown-drives.cjs /tmp/hometown-drives.cjs
          git switch --detach 817ebffb5f4ca12c316509dbd65d1940d657c6bb
          cp /tmp/hometown-drives.cjs tests/hometown-drives.cjs
          python3 /tmp/pro-modal-fix.py
          npm test
          git diff --check
          git diff --exit-code -- assets legacy
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add index.html dist/index.html src/memory-replay-ui.js src/pro-driving-ui.js tests package.json
          git commit -m 'Fence modal shortcuts, retain P pause and verify all three itineraries'
          git push origin HEAD:refs/heads/chatgpt/reborn-pro-driving-engine
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        gate: [core, pro, ux, session, navigation, updates, release, memory, workshop, weather, passengers, echoes, website]
    env:
      REBORN_BROWSER_DRIVER: playwright
      REBORN_BROWSER_LOW: '1'
      REBORN_EVIDENCE: /tmp/pro-final/browser
      REBORN_SCREENSHOTS: /tmp/pro-final/screenshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: mkdir -p /tmp/pro-final && npm run build:site
      - if: matrix.gate != 'core'
        run: |
          python3 -m pip install playwright==1.57.0 pillow
          python3 -m playwright install --with-deps chromium
          python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("REBORN_CHROMIUM="+p.chromium.executable_path)' >> "$GITHUB_ENV"
      - name: Actual acceptance with failure propagation
        shell: bash
        run: |
          set -euo pipefail
          {
            case '${{ matrix.gate }}' in
              core) npm test; npm run validate:assets; npm run test:http; npm run test:site;;
              pro) npm run test:pro:browser;;
              ux) npm run test:ux;;
              session) npm run test:session:browser;;
              navigation) npm run test:navigation:browser;;
              updates) npm run test:updates:browser;;
              release) npm run test:release:browser;;
              memory) npm run test:memory:browser;;
              workshop) npm run test:workshop:browser;;
              weather) npm run test:weather:browser;;
              passengers) npm run test:stories:browser; npm run test:stories:packaged;;
              echoes) npm run test:echo:browser;;
              website) npm run test:site:browser;;
            esac
          } 2>&1 | tee /tmp/pro-final/results.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reborn-pro-final-${{ matrix.gate }}-evidence
          path: /tmp/pro-final/
          retention-days: 7
  packages:
    needs: [source,verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require identical repeat builds
        shell: bash
        run: |
          set -euo pipefail
          npm run package:site
          cp packages/SHA256SUMS.txt /tmp/first.txt
          npm run package:site
          cmp /tmp/first.txt packages/SHA256SUMS.txt
          npm run test:site
          git diff --exit-code
          git archive --format=tar HEAD | gzip -n > packages/verified-engine-source.tar.gz
          git rev-parse HEAD > packages/SOURCE-COMMIT.txt
          cp site-dist/release.json packages/release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reborn-pro-final-engine-packages
          path: packages/
          retention-days: 7
  source-export:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - run: |
          mkdir -p /tmp/pro-source
          git archive --format=tar HEAD | gzip -n > /tmp/pro-source/source.tar.gz
          git rev-parse HEAD > /tmp/pro-source/SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reborn-pro-final-engine-source
          path: /tmp/pro-source/
          retention-days: 7
