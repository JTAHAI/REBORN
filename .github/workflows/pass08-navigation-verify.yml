name: REBORN Pass 8 plus navigation repair
on:
  push:
    branches: ['chatgpt/pass08-navigation-verify']
    paths: ['.github/workflows/pass08-navigation-verify.yml']
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Integrate the locally checked candidate without changing main or production
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          cp .github/pass08-navigation-integrate.py /tmp/integrate-navigation.py
          test "$(git ls-remote origin refs/heads/chatgpt/reborn-pass08-release-hardening | cut -f1)" = 'a7641ebe5fc1fc52f7ba96ce9ca2062ae31cafa9'
          git switch --detach a7641ebe5fc1fc52f7ba96ce9ca2062ae31cafa9
          python3 /tmp/integrate-navigation.py
          npm test
          git diff --exit-code -- assets legacy src index.html dist website-game-shell website/_headers website/_redirects
          git diff --check
          git switch -c pass08-verified-integration
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add .gitignore package.json tests/update-safety-browser.py tools/build-site.cjs tools/service-worker.template.js tests/service-worker-navigation.cjs tests/service-worker-navigation-browser.py website/repair/index.html docs/PASS_08_NAVIGATION_INTEGRATION.md
          git commit -m 'Carry the Chrome loading repair into Pass 8 without losing idle-consent updates'
          git push origin HEAD:refs/heads/chatgpt/reborn-pass08-release-hardening
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        gate: [core, navigation, release, updates, ux, memory, workshop, weather, passengers, echoes, website]
    env:
      REBORN_BROWSER_DRIVER: playwright
      REBORN_BROWSER_LOW: '1'
      REBORN_SCREENSHOTS: /tmp/pass08-fixed-evidence/screenshots
      REBORN_EVIDENCE: /tmp/pass08-fixed-evidence/navigation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.checkpoint.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - run: mkdir -p /tmp/pass08-fixed-evidence && npm run build:site
      - if: matrix.gate != 'core'
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("REBORN_CHROMIUM="+p.chromium.executable_path)' >> "$GITHUB_ENV"
      - name: Run independent acceptance
        shell: bash
        run: |
          set -euo pipefail
          {
            case '${{ matrix.gate }}' in
              core) npm test; npm run validate:assets; npm run test:http; node tests/controls-acceptance.cjs; node tests/driving-behavior.cjs; node tests/readability-acceptance.cjs; node tests/vehicle-shell-acceptance.cjs; node tests/town-packaging.cjs; npm run test:site; git diff --exit-code;;
              navigation) npm run test:navigation:browser;;
              release) npm run test:release:browser;;
              updates) npm run test:updates:browser;;
              ux) npm run test:ux;;
              memory) npm run test:memory:browser;;
              workshop) npm run test:workshop:browser;;
              weather) npm run test:weather:browser;;
              passengers) npm run test:stories:browser; npm run test:stories:packaged;;
              echoes) npm run test:echo:browser;;
              website) npm run test:site:browser;;
            esac
          } 2>&1 | tee /tmp/pass08-fixed-evidence/results.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reborn-pass08-fixed-${{ matrix.gate }}-evidence
          path: /tmp/pass08-fixed-evidence/
          retention-days: 7
  packages:
    needs: [checkpoint, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.checkpoint.outputs.source }}
          persist-credentials: false
      - name: Build and inspect complete website and matching standalone
        run: |
          npm run package:site
          npm run test:site
          git diff --exit-code
          cp site-dist/release.json packages/release.json
          git rev-parse HEAD > packages/SOURCE-COMMIT.txt
          git diff a7641ebe5fc1fc52f7ba96ce9ca2062ae31cafa9 HEAD --stat > packages/INTEGRATION-CHANGES.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reborn-pass08-fixed-deployment-packages
          path: packages/
          retention-days: 7
          if-no-files-found: error
