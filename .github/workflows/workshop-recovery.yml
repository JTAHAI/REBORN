name: REBORN workshop and recorder release
on:
  push:
    branches: ['chatgpt/reborn-workshop-verify']
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 786111357f7b77087377fb02841fb6e5231d412d
          fetch-depth: 0
      - name: Preserve exact source checkpoint without moving main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-cecc-81f5-a2fd-bef88e77a94e/raw?se=2026-09-27T22%3A46%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=3e44c9c6-cfdb-5f73-9f34-331850f9fedf&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T15%3A47%3A05Z&ske=2026-09-28T15%3A47%3A05Z&sks=b&skv=2026-02-06&sig=cmWTXUZgLxbwpKz/orgJ5YwMu8ImDFhUzQLa9f1eb4E%3D' -o /tmp/checkpoint.zip
          echo '2f972b0983193897421e21eb5f6c8fd8a100b9832ca26d899452d91751ddd969  /tmp/checkpoint.zip' | sha256sum -c -
          unzip /tmp/checkpoint.zip -d /tmp/source
          git bundle verify /tmp/source/source.bundle
          git fetch /tmp/source/source.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = '3957339883932f0ed4c3bc9657ae4118aa8def29'
          git merge-base --is-ancestor 786111357f7b77087377fb02841fb6e5231d412d FETCH_HEAD
          git push origin FETCH_HEAD:refs/heads/chatgpt/reborn-workshop-memory-ux
          echo 'sha=3957339883932f0ed4c3bc9657ae4118aa8def29' >> "$GITHUB_OUTPUT"
  verify:
    needs: checkpoint
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: core
            command: npm test && npm run validate:assets && npm run test:http && node tests/controls-acceptance.cjs && node tests/driving-behavior.cjs && node tests/readability-acceptance.cjs && node tests/vehicle-shell-acceptance.cjs && node tests/town-packaging.cjs && git diff --check && git diff --exit-code
          - lane: memory
            command: npm run test:memory:browser
          - lane: workshop
            command: npm run test:workshop:browser
          - lane: ux
            command: npm run test:ux
          - lane: weather
            command: npm run test:weather:browser
          - lane: passengers
            command: npm run test:stories:browser && npm run test:stories:packaged
          - lane: echoes
            command: npm run test:echo:browser
          - lane: website
            command: npm run test:site:browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REBORN_BROWSER_DRIVER: playwright
      REBORN_BROWSER_LOW: '1'
      REBORN_SCREENSHOTS: /tmp/evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.checkpoint.outputs.source }}
          fetch-depth: 0
      - name: Build exact packaged site
        run: |
          mkdir -p /tmp/evidence
          npm run build:site
          npm run test:site
      - name: Install isolated browser
        if: matrix.lane != 'core'
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("REBORN_CHROMIUM="+p.chromium.executable_path)' >> "$GITHUB_ENV"
      - name: Execute independent acceptance lane
        run: |
          set -euo pipefail
          { ${{ matrix.command }}; } 2>&1 | tee /tmp/evidence/verification.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reborn-workshop-${{ matrix.lane }}-evidence
          path: /tmp/evidence/
          retention-days: 7
          if-no-files-found: error
  package:
    needs: [checkpoint, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.checkpoint.outputs.source }}
      - name: Package verified website and identical standalone
        run: |
          npm run package:site
          npm run test:site
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reborn-workshop-deployment-packages
          path: packages/
          retention-days: 7
          if-no-files-found: error
