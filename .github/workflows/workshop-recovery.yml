name: REBORN workshop and recorder checkpoint
on:
  push:
    branches: ['chatgpt/reborn-workshop-verify']
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fdd6b07436ced68ea9a2e70b0891abb1752e4270
          fetch-depth: 0
      - name: Recover exact source history and push a durable draft checkpoint
        id: source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-dd7c-81f5-a992-7c82c3541998/raw?se=2026-09-27T22%3A36%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=b1ea2c18-60b4-528a-9ac7-9a14ad9759fd&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T12%3A41%3A57Z&ske=2026-09-28T12%3A41%3A57Z&sks=b&skv=2026-02-06&sig=Wc85utWad7hedZVVwA%2BkLKz9%2BkavsrrEEi8pgBwNicI%3D' -o /tmp/checkpoint.zip
          echo '2eb7054ffd23b81053b43b7bba2be87e2d0ce3aeef9a70ceb4e9279e9957db67  /tmp/checkpoint.zip' | sha256sum -c -
          unzip /tmp/checkpoint.zip -d /tmp/source
          git bundle verify /tmp/source/source.bundle
          git fetch /tmp/source/source.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = '786111357f7b77087377fb02841fb6e5231d412d'
          git merge-base --is-ancestor fdd6b07436ced68ea9a2e70b0891abb1752e4270 FETCH_HEAD
          git push origin FETCH_HEAD:refs/heads/chatgpt/reborn-workshop-memory-ux
          echo 'sha=786111357f7b77087377fb02841fb6e5231d412d' >> "$GITHUB_OUTPUT"
  browser:
    needs: checkpoint
    strategy:
      fail-fast: false
      matrix:
        focus: [memory, workshop]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      REBORN_BROWSER_DRIVER: playwright
      REBORN_BROWSER_LOW: '1'
      REBORN_SCREENSHOTS: /tmp/evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.checkpoint.outputs.source }}
          fetch-depth: 0
      - name: Build exact packaged site
        run: |
          mkdir -p /tmp/evidence
          npm run build:site
          npm run test:site
      - name: Install isolated browser
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("REBORN_CHROMIUM="+p.chromium.executable_path)' >> "$GITHUB_ENV"
      - name: Exercise actual browser interactions
        run: |
          set -o pipefail
          npm run test:${{ matrix.focus }}:browser 2>&1 | tee /tmp/evidence/browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reborn-workshop-${{ matrix.focus }}-checkpoint
          path: /tmp/evidence/
          retention-days: 7
          if-no-files-found: error
