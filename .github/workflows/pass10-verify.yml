name: REBORN Pass 10 graphics recovery verification
# Exact split patch chunks are normalized before checksum verification.
on:
  push:
    branches: [chatgpt/pass10-verify]
    paths: [.github/workflows/pass10-verify.yml]
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reproduce the exact locally checked candidate without changing main or production
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pass10-evidence
          cat \
            .github/pass10.patch.1.b64 \
            .github/pass10.patch.2.b64 \
            .github/pass10.patch.3a.b64 \
            .github/pass10.patch.3b.b64 \
            .github/pass10.patch.41.b64 \
            .github/pass10.patch.42.b64 \
            .github/pass10.patch.43.b64 \
            .github/pass10.patch.44.b64 \
            .github/pass10.patch.51.b64 \
            .github/pass10.patch.52.b64 \
            .github/pass10.patch.53.b64 \
            .github/pass10.patch.54.b64 \
            .github/pass10.patch.6.b64 | tr -d '\r\n\t ' > /tmp/pass10.patch.b64
          test "$(wc -c < /tmp/pass10.patch.b64)" = '66552'
          base64 -d /tmp/pass10.patch.b64 > /tmp/pass10.patch.gz
          echo 'e5f6b277e644bbc2d6ab70e99f91a01b62a32686bc769574fb12af396b8db34b  /tmp/pass10.patch.gz' | sha256sum -c -
          gzip -dc /tmp/pass10.patch.gz > /tmp/pass10.patch
          echo 'db3a1e61dbe1f8c866b139806b256e113affef776ea6bd2871d1fcf2c1185bad  /tmp/pass10.patch' | sha256sum -c -
          test "$(git ls-remote origin refs/heads/chatgpt/reborn-pass10-graphics-recovery | cut -f1)" = 'b379b4d3f6884f9548855cf1798387003edcb39f'
          git switch --detach b379b4d3f6884f9548855cf1798387003edcb39f
          git apply --index /tmp/pass10.patch
          test "$(git write-tree)" = '3990122e5579fc32783f56d1baa1109845b0ee9b'
          git diff --cached --check
          npm test 2>&1 | tee /tmp/pass10-evidence/core.log
          git diff --cached --exit-code -- assets legacy website/_headers website/_redirects
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git commit -m 'Recover interrupted graphics in place or continue in local compatibility mode'
          git push origin HEAD:refs/heads/chatgpt/reborn-pass10-graphics-recovery
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > /tmp/pass10-evidence/SOURCE-COMMIT.txt
          git write-tree > /tmp/pass10-evidence/SOURCE-TREE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reborn-pass10-checkpoint-evidence
          path: /tmp/pass10-evidence/
          retention-days: 7
  verify:
    needs: checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gate: [core, graphics, session, navigation, updates, release, ux, memory, workshop, weather, passengers, echoes, website]
    env:
      REBORN_BROWSER_DRIVER: playwright
      REBORN_BROWSER_LOW: '1'
      REBORN_SCREENSHOTS: /tmp/pass10-evidence/screenshots
      REBORN_EVIDENCE: /tmp/pass10-evidence/browser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.checkpoint.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: mkdir -p /tmp/pass10-evidence && npm run build:site
      - if: matrix.gate != 'core'
        name: Browser dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("REBORN_CHROMIUM="+p.chromium.executable_path)' >> "$GITHUB_ENV"
      - name: Independent acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          {
            case '${{ matrix.gate }}' in
              core) npm test; npm run validate:assets; npm run test:http; node tests/controls-acceptance.cjs; node tests/driving-behavior.cjs; node tests/readability-acceptance.cjs; node tests/vehicle-shell-acceptance.cjs; node tests/town-packaging.cjs; npm run test:site;;
              graphics) npm run test:graphics:browser;;
              session) npm run test:session:browser;;
              navigation) npm run test:navigation:browser;;
              updates) npm run test:updates:browser;;
              release) npm run test:release:browser;;
              ux) npm run test:ux;;
              memory) npm run test:memory:browser;;
              workshop) npm run test:workshop:browser;;
              weather) npm run test:weather:browser;;
              passengers) npm run test:stories:browser; npm run test:stories:packaged;;
              echoes) npm run test:echo:browser;;
              website) npm run test:site:browser;;
            esac
            git diff --exit-code
          } 2>&1 | tee /tmp/pass10-evidence/results.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reborn-pass10-${{ matrix.gate }}-evidence
          path: /tmp/pass10-evidence/
          retention-days: 7
  packages:
    needs: [checkpoint, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.checkpoint.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Rebuild twice and require identical complete packages
        shell: bash
        run: |
          set -euo pipefail
          npm run package:site
          cp packages/SHA256SUMS.txt /tmp/first-build.txt
          npm run package:site
          cmp /tmp/first-build.txt packages/SHA256SUMS.txt
          npm run test:site
          git diff --exit-code
          cp site-dist/release.json packages/release.json
          git rev-parse HEAD > packages/SOURCE-COMMIT.txt
          git write-tree > packages/SOURCE-TREE.txt
          git diff b379b4d3f6884f9548855cf1798387003edcb39f HEAD --stat > packages/CHANGES.txt
          git bundle create /tmp/reborn-pass10-verified-source.bundle --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reborn-pass10-verified-packages
          path: packages/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reborn-pass10-verified-source
          path: /tmp/reborn-pass10-verified-source.bundle
          retention-days: 3
