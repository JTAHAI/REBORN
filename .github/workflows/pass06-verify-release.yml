name: Verify and package REBORN Echo Roads
on:
  push:
    branches: ['chatgpt/pass06-verify-release']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REBORN_BROWSER_DRIVER: playwright
      REBORN_BROWSER_LOW: '1'
      REBORN_SCREENSHOTS: /tmp/pass06-evidence/screenshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 708ce1719d4ca66efbc09e2e857245757fcf372c
          fetch-depth: 0
      - name: Apply checksum-verified candidate
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/chatgpt/reborn-pass05-drive-stories | cut -f1)" = '708ce1719d4ca66efbc09e2e857245757fcf372c'
          test -z "$(git ls-remote origin refs/heads/chatgpt/reborn-pass06-echo-roads)"
          curl -fL --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-f0e0-81f5-929c-a4190f6c1b61/raw?se=2026-09-26T23%3A56%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=20c50bdf-0565-5137-971a-dd03ff6f3fbd&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T17%3A08%3A34Z&ske=2026-09-27T17%3A08%3A34Z&sks=b&skv=2026-02-06&sig=z/WyJNCB0xklYGlfImN5IwMfS8vyb%2BDRag9ExbmapaY%3D' -o /tmp/candidate.zip
          echo 'e3da0493d28077ff355486ca7a0f51321dcc7d66986077f31042be47610db3e2  /tmp/candidate.zip' | sha256sum -c -
          unzip -o /tmp/candidate.zip
          git switch -c chatgpt/reborn-pass06-echo-roads
          mkdir -p /tmp/pass06-evidence
          npm run build
          npm run build:site
      - name: Test-only browser
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("REBORN_CHROMIUM="+p.chromium.executable_path)' >> "$GITHUB_ENV"
      - name: Core, driving, asset and package regressions
        run: |
          set -euo pipefail
          {
            npm test
            npm run validate:assets
            npm run test:http
            node tests/controls-acceptance.cjs
            node tests/driving-behavior.cjs
            node tests/readability-acceptance.cjs
            node tests/vehicle-shell-acceptance.cjs
            node tests/town-packaging.cjs
            npm run test:site
            git diff --exit-code -- assets/worlds/north-berwick/world.json assets/vehicles/jetta-mkiv/volkswagen-bora-jetta-mk4-2005.cc-by-4.0.glb legacy/99-5-REBORN-Build-004-PLAY.html
            git diff --check
          } 2>&1 | tee /tmp/pass06-evidence/regressions.log
      - name: Six-place Echo Roads packaged browser acceptance
        run: |
          set -o pipefail
          npm run test:echo:browser 2>&1 | tee /tmp/pass06-evidence/echo-browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reborn-pass06-echo-checkpoint
          path: /tmp/pass06-evidence/
          retention-days: 3
      - name: Existing desktop and touch UX
        if: always()
        run: |
          set -o pipefail
          npm run test:ux 2>&1 | tee /tmp/pass06-evidence/ux.log
      - name: Weather and passenger regression browsers
        if: always()
        run: |
          set -euo pipefail
          {
            npm run test:weather:browser
            npm run test:stories:browser
            npm run test:stories:packaged
          } 2>&1 | tee /tmp/pass06-evidence/prior-browser.log
      - name: Full website, offline and historical cache upgrade
        if: always()
        run: |
          set -o pipefail
          npm run test:site:browser 2>&1 | tee /tmp/pass06-evidence/website.log
      - name: Commit and push only the verified integration branch
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add README.md index.html dist docs package.json package-lock.json src tests tools website
          git diff --cached --check
          git commit -m 'Add Echo Roads memory drives and layered hometown interpretation'
          git push origin HEAD:refs/heads/chatgpt/reborn-pass06-echo-roads
          git rev-parse HEAD | tee /tmp/pass06-evidence/source-commit.txt
          npm run package:site 2>&1 | tee /tmp/pass06-evidence/packages.log
          npm run test:site
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reborn-pass06-evidence
          path: /tmp/pass06-evidence/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reborn-pass06-deployment-packages
          path: packages/
          retention-days: 7
          if-no-files-found: error
