name: Export existing Pass 11 source
on:
  push:
    branches: [chatgpt/pass11-existing-audit]
    paths: [.github/workflows/export-existing-pass11.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git bundle create /tmp/reborn-pass11-existing.bundle --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reborn-pass11-existing-source
          path: /tmp/reborn-pass11-existing.bundle
          retention-days: 3
