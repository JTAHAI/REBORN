name: REBORN Pass 9 save safety verification
on:
  push:
    branches: [chatgpt/pass09-verify]
    paths: [.github/workflows/pass09.yml]
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reproduce the exact locally tested candidate without changing main or production
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pass09-transport /tmp/checkpoint-evidence
          cp .github/pass09-candidate.*.b64 /tmp/pass09-transport/
          cp .github/pass09-apply.py /tmp/pass09-apply.py
          test "$(git ls-remote origin refs/heads/chatgpt/reborn-pass09-session-reliability | cut -f1)" = '1c1fedf3c6b12ba8cb9912ab36106e12711e443a'
          git switch --detach 1c1fedf3c6b12ba8cb9912ab36106e12711e443a
          python3 /tmp/pass09-apply.py /tmp/pass09-transport
          npm test 2>&1 | tee /tmp/checkpoint-evidence/core.log
          git diff --cached --exit-code -- assets legacy website/_headers website/_redirects
          git diff --cached --check
          test "$(git write-tree)" = '09ce29187a53a446ce8c17ecff0affd225af540e'
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git commit -m 'Protect local progress from stale tabs and preserve recovery copies on failed saves'
          git push origin HEAD:refs/heads/chatgpt/reborn-pass09-session-reliability
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > /tmp/checkpoint-evidence/SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reborn-pass09-checkpoint-evidence
          path: /tmp/checkpoint-evidence/
          retention-days: 7
  verify:
    needs: checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        gate: [core, session, navigation, updates, release, ux, memory, workshop, weather, passengers, echoes, website]
    env:
      REBORN_BROWSER_DRIVER: playwright
      REBORN_BROWSER_LOW: '1'
      REBORN_SCREENSHOTS: /tmp/pass09-evidence/screenshots
      REBORN_EVIDENCE: /tmp/pass09-evidence/browser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.checkpoint.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: mkdir -p /tmp/pass09-evidence && npm run build:site
      - if: matrix.gate != 'core'
        name: Browser dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("REBORN_CHROMIUM="+p.chromium.executable_path)' >> "$GITHUB_ENV"
      - name: Independent acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          {
            case '${{ matrix.gate }}' in
              core) npm test; npm run validate:assets; npm run test:http; node tests/controls-acceptance.cjs; node tests/driving-behavior.cjs; node tests/readability-acceptance.cjs; node tests/vehicle-shell-acceptance.cjs; node tests/town-packaging.cjs; npm run test:site;;
              session) npm run test:session:browser;;
              navigation) npm run test:navigation:browser;;
              updates) npm run test:updates:browser;;
              release) npm run test:release:browser;;
              ux) npm run test:ux;;
              memory) npm run test:memory:browser;;
              workshop) npm run test:workshop:browser;;
              weather) npm run test:weather:browser;;
              passengers) npm run test:stories:browser; npm run test:stories:packaged;;
              echoes) npm run test:echo:browser;;
              website) npm run test:site:browser;;
            esac
            git diff --exit-code
          } 2>&1 | tee /tmp/pass09-evidence/results.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reborn-pass09-${{ matrix.gate }}-evidence
          path: /tmp/pass09-evidence/
          retention-days: 7
  packages:
    needs: [checkpoint, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.checkpoint.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Rebuild twice and require identical complete packages
        shell: bash
        run: |
          set -euo pipefail
          npm run package:site
          cp packages/SHA256SUMS.txt /tmp/first-build.txt
          npm run package:site
          cmp /tmp/first-build.txt packages/SHA256SUMS.txt
          npm run test:site
          git diff --exit-code
          cp site-dist/release.json packages/release.json
          git rev-parse HEAD > packages/SOURCE-COMMIT.txt
          git diff 9d5e6d926edfdf93ec8cf2b46812089ef5f44cdc HEAD --stat > packages/CHANGES.txt
          git bundle create /tmp/reborn-pass09-verified-source.bundle --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reborn-pass09-verified-packages
          path: packages/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reborn-pass09-verified-source
          path: /tmp/reborn-pass09-verified-source.bundle
          retention-days: 3
