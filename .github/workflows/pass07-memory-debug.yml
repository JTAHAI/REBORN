name: Focused REBORN Pass 7 browser diagnostics
on:
  push:
    branches: ['chatgpt/pass07-memory-debug']
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REBORN_BROWSER_DRIVER: playwright
      REBORN_BROWSER_LOW: '1'
      REBORN_SCREENSHOTS: /tmp/pass07-debug/screenshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fdd6b07436ced68ea9a2e70b0891abb1752e4270
      - name: Apply candidate
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-c730-81f5-9401-e18104df7031/raw?se=2026-09-27T07%3A43%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=b8534296-6611-5506-8e79-fb8b13b11aac&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T06%3A37%3A11Z&ske=2026-09-28T06%3A37%3A11Z&sks=b&skv=2026-02-06&sig=C/X9ExGDJbGn1Zx9IPMJntXbMV0xmXiSXOA6HBh/Ono%3D' -o /tmp/pass07.zip
          echo '212475d8e825a945e864b4ea3ce39fd57e7ddac33dd2976f9aea870e9e630c08  /tmp/pass07.zip' | sha256sum -c -
          unzip -o /tmp/pass07.zip
          mkdir -p /tmp/pass07-debug/screenshots
          npm run build:site
      - name: Install browser
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("REBORN_CHROMIUM="+p.chromium.executable_path)' >> "$GITHUB_ENV"
      - name: Run focused acceptance
        run: |
          set -o pipefail
          npm run test:memory:browser 2>&1 | tee /tmp/pass07-debug/memory.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reborn-pass07-memory-debug
          path: /tmp/pass07-debug/
          retention-days: 3
