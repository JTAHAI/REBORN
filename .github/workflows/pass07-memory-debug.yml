name: Focused REBORN Pass 7 browser diagnostics
on:
  push:
    branches: ['chatgpt/pass07-memory-debug']
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REBORN_BROWSER_DRIVER: playwright
      REBORN_BROWSER_LOW: '1'
      REBORN_SCREENSHOTS: /tmp/pass07-debug/screenshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fdd6b07436ced68ea9a2e70b0891abb1752e4270
      - name: Apply candidate
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-3f84-81f5-98f2-fdb577e6c651/raw?se=2026-09-27T07%3A35%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=5cb64149-b0f9-5daf-9457-cc1c9a214b64&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T21%3A05%3A40Z&ske=2026-09-27T21%3A05%3A40Z&sks=b&skv=2026-02-06&sig=1f9UooYunppYaQzA8aO1j3mqhzypNeY8Vbu3qqCppds%3D' -o /tmp/pass07.zip
          echo 'f8c28be409e3321e7d0a1e813f1ccfdf2d0365aad571419059a71fcd2e9bf189  /tmp/pass07.zip' | sha256sum -c -
          unzip -o /tmp/pass07.zip
          mkdir -p /tmp/pass07-debug/screenshots
          npm run build:site
      - name: Install browser
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("REBORN_CHROMIUM="+p.chromium.executable_path)' >> "$GITHUB_ENV"
      - name: Run focused acceptance
        run: |
          set -o pipefail
          npm run test:memory:browser 2>&1 | tee /tmp/pass07-debug/memory.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reborn-pass07-memory-debug
          path: /tmp/pass07-debug/
          retention-days: 3
